<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Glimms works</title>
<style>
  :root { --bg:#0E0E0E; --card:#1A1A1A; --line:#3a3a3a; --cream:#EDE8DF; --mid:#9a958c; --gold:#C9A84C; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--cream);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  .wrap { max-width:1200px; margin:0 auto; padding:16px; display:flex; flex-direction:column; min-height:100%; }
  h1 { font-size:20px; font-weight:600; margin:4px 0 8px; letter-spacing:.02em; }
  h1 span { color:var(--gold); }
  svg { width:100%; height:auto; display:block; }
  text { fill:var(--cream); font-family:inherit; }
  .sub { fill:var(--mid); font-size:12px; }
  .ttl { font-size:15px; font-weight:600; }
  .node rect, .node path.shape { fill:var(--card); stroke:var(--line); stroke-width:1.5; transition:stroke .4s, filter .4s; }
  .node { opacity:.45; transition:opacity .4s; }
  .node.on { opacity:1; }
  .node.hot rect, .node.hot path.shape { stroke:var(--gold); filter:drop-shadow(0 0 8px rgba(201,168,76,.55)); }
  .wire { stroke:var(--line); stroke-width:2; fill:none; stroke-dasharray:5 6; opacity:.5; transition:stroke .4s, opacity .4s; }
  .wire.on { stroke:var(--gold); opacity:1; animation:flow 1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset:-22; } }
  .step rect { fill:#141414; stroke:var(--line); stroke-width:1.2; transition:all .35s; }
  .step text { fill:var(--mid); font-size:13px; transition:fill .35s; }
  .step .tick { opacity:0; transition:opacity .3s; }
  .step.run rect { stroke:var(--gold); fill:#221d10; }
  .step.run text { fill:var(--cream); }
  .step.done rect { stroke:#5d7a52; }
  .step.done text { fill:var(--cream); }
  .step.done .tick { opacity:1; }
  .screen { opacity:0; transition:opacity .45s; }
  .screen.show { opacity:1; }
  #bar { transition:width .5s ease-out; }
  .pop { transform-box:fill-box; transform-origin:center; transform:scale(.4); opacity:0; transition:transform .5s cubic-bezier(.3,1.6,.5,1), opacity .3s; }
  .show .pop { transform:scale(1); opacity:1; }
  .show .pop:nth-of-type(2) { transition-delay:.15s; } .show .pop:nth-of-type(3) { transition-delay:.3s; }
  #note { transform:translateY(-40px); opacity:0; transition:transform .5s cubic-bezier(.3,1.4,.5,1), opacity .3s; }
  #note.show { transform:none; opacity:1; }
  #flash { opacity:0; }
  #flash.go { animation:flash .5s ease-out; }
  @keyframes flash { 0% { opacity:.9; } 100% { opacity:0; } }
  .caption { display:flex; gap:14px; align-items:flex-start; min-height:74px; margin-top:8px; }
  .num { flex:none; width:38px; height:38px; border-radius:50%; background:var(--gold); color:#111; font-weight:700;
    display:flex; align-items:center; justify-content:center; }
  .caption h2 { margin:0 0 4px; font-size:18px; }
  .caption p { margin:0; color:var(--mid); font-size:14.5px; line-height:1.45; max-width:75ch; }
  .controls { display:flex; align-items:center; gap:10px; margin-top:10px; flex-wrap:wrap; }
  button { background:var(--card); color:var(--cream); border:1px solid var(--line); border-radius:999px;
    padding:8px 16px; font-size:14px; cursor:pointer; }
  button:hover, button:focus-visible { border-color:var(--gold); outline:none; }
  .dots { display:flex; gap:8px; margin-left:auto; }
  .dots button { width:12px; height:12px; padding:0; border-radius:50%; background:#333; border:none; }
  .dots button.cur { background:var(--gold); }
  @media (prefers-reduced-motion: reduce) { .wire.on { animation:none; } * { transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>How <span>Glimms</span> works</h1>

  <svg viewBox="0 0 1200 630" role="img" aria-labelledby="capTitle capText">
    <!-- wires -->
    <path id="w-phone-api" class="wire" d="M230 310 L330 310"/>
    <path id="w-api-s3" class="wire" d="M405 265 L405 180"/>
    <path id="w-api-db" class="wire" d="M405 355 L405 440"/>
    <path id="w-api-queue" class="wire" d="M480 310 L550 310"/>
    <path id="w-queue-ai" class="wire" d="M660 310 L730 310"/>
    <path id="w-ai-vec" class="wire" d="M1000 312 L1020 312"/>
    <path id="w-back" class="wire" d="M740 522 C 640 612, 300 612, 215 484"/>
    <path id="w-pay" class="wire" d="M145 480 L145 548"/>
    <text id="backLabel" class="sub" x="470" y="606" text-anchor="middle" opacity="0">live progress, then a push notification</text>

    <!-- phone -->
    <g id="n-phone" class="node on">
      <rect x="60" y="150" width="170" height="330" rx="26"/>
      <rect x="72" y="172" width="146" height="286" rx="12" style="fill:#0b0b0b;stroke:#2a2a2a"/>
      <text class="ttl" x="145" y="138" text-anchor="middle">Glimms app</text>
      <clipPath id="clip"><rect x="72" y="172" width="146" height="286" rx="12"/></clipPath>
      <g clip-path="url(#clip)">
        <!-- camera -->
        <g id="s-camera" class="screen">
          <path d="M92 200 h-10 v10 M198 200 h10 v10 M92 400 h-10 v-10 M198 400 h10 v-10" stroke="#C9A84C" stroke-width="2" fill="none"/>
          <path d="M120 250 l15 -12 q10 9 20 0 l15 12 l-9 13 l-8 -5 v62 h-36 v-62 l-8 5 z" fill="#8f6f3a"/>
          <text class="sub" x="145" y="358" text-anchor="middle">Wardrobe or room</text>
          <circle cx="145" cy="425" r="15" fill="none" stroke="#EDE8DF" stroke-width="3"/>
          <circle cx="145" cy="425" r="9" fill="#EDE8DF"/>
          <rect id="flash" x="72" y="172" width="146" height="286" fill="#fff"/>
        </g>
        <!-- progress -->
        <g id="s-progress" class="screen">
          <text class="ttl" x="145" y="270" text-anchor="middle">Styling…</text>
          <rect x="92" y="290" width="106" height="10" rx="5" fill="#2a2a2a"/>
          <rect id="bar" x="92" y="290" width="0" height="10" rx="5" fill="#C9A84C"/>
          <text id="pct" class="sub" x="145" y="326" text-anchor="middle">0%</text>
          <text id="stepLabel" class="sub" x="145" y="346" text-anchor="middle"></text>
        </g>
        <!-- results -->
        <g id="s-results" class="screen">
          <text class="ttl" x="145" y="212" text-anchor="middle" style="font-size:13px">Your looks</text>
          <g class="pop"><rect x="84" y="224" width="122" height="66" rx="10" fill="#22201b"/>
            <path d="M100 240 l8 -6 q6 5 12 0 l8 6 l-5 7 l-4 -3 v30 h-20 v-30 l-4 3 z" fill="#8f6f3a"/>
            <rect x="136" y="236" width="16" height="40" rx="3" fill="#4d5a6b"/><rect x="160" y="262" width="30" height="12" rx="6" fill="#b9b2a4"/></g>
          <g class="pop"><rect x="84" y="298" width="122" height="66" rx="10" fill="#22201b"/>
            <path d="M100 314 l8 -6 q6 5 12 0 l8 6 l-5 7 l-4 -3 v30 h-20 v-30 l-4 3 z" fill="#6b7f5e"/>
            <rect x="136" y="310" width="16" height="40" rx="3" fill="#2f2f33"/><rect x="160" y="336" width="30" height="12" rx="6" fill="#8f6f3a"/></g>
          <g class="pop"><rect x="84" y="372" width="122" height="66" rx="10" fill="#22201b"/>
            <path d="M100 388 l8 -6 q6 5 12 0 l8 6 l-5 7 l-4 -3 v30 h-20 v-30 l-4 3 z" fill="#b9b2a4"/>
            <rect x="136" y="384" width="16" height="40" rx="3" fill="#7a4b3a"/><rect x="160" y="410" width="30" height="12" rx="6" fill="#2f2f33"/></g>
          <path id="heart" d="M196 232 c-3 -5 -10 -2 -10 3 c0 5 6 8 10 12 c4 -4 10 -7 10 -12 c0 -5 -7 -8 -10 -3z" fill="none" stroke="#C9A84C" stroke-width="1.5" transform="translate(-4 2) scale(.9)" style="transform-box:fill-box;transform-origin:center"/>
        </g>
        <g id="note"><rect x="78" y="178" width="134" height="34" rx="9" fill="#EDE8DF"/>
          <text x="88" y="193" style="fill:#111;font-size:10px;font-weight:700">Glimms</text>
          <text x="88" y="205" style="fill:#333;font-size:9.5px">Your looks are ready</text></g>
      </g>
    </g>

    <!-- payments -->
    <g id="n-pay" class="node">
      <rect x="60" y="548" width="170" height="62" rx="12"/>
      <text class="ttl" x="145" y="574" text-anchor="middle">Paystack · Credo</text>
      <text class="sub" x="145" y="594" text-anchor="middle">upgrade for more scans</text>
    </g>

    <!-- api + stores -->
    <g id="n-s3" class="node"><rect x="330" y="110" width="150" height="70" rx="12"/>
      <text class="ttl" x="405" y="140" text-anchor="middle">Photo storage</text><text class="sub" x="405" y="160" text-anchor="middle">Amazon S3</text></g>
    <g id="n-api" class="node"><rect x="330" y="265" width="150" height="90" rx="12"/>
      <text class="ttl" x="405" y="300" text-anchor="middle">Glimms API</text>
      <text class="sub" x="405" y="320" text-anchor="middle">sign-in, scan limits,</text><text class="sub" x="405" y="336" text-anchor="middle">billing</text></g>
    <g id="n-db" class="node"><rect x="330" y="440" width="150" height="70" rx="12"/>
      <text class="ttl" x="405" y="470" text-anchor="middle">Database</text><text class="sub" x="405" y="490" text-anchor="middle">Postgres on Supabase</text></g>
    <g id="n-queue" class="node"><rect x="550" y="275" width="110" height="70" rx="12"/>
      <text class="ttl" x="605" y="305" text-anchor="middle">Job queue</text><text class="sub" x="605" y="325" text-anchor="middle">Redis</text></g>

    <!-- AI panel -->
    <g id="n-ai" class="node">
      <rect x="730" y="80" width="410" height="450" rx="16"/>
      <text class="ttl" x="750" y="110">AI pipeline</text>
      <text class="sub" x="750" y="127">a background worker runs each step</text>
      <g id="steps"></g>
      <g id="n-vec"><rect x="1020" y="278" width="104" height="68" rx="10" style="fill:#141414"/>
        <text x="1072" y="306" text-anchor="middle" style="font-size:13px;font-weight:600">Style memory</text>
        <text class="sub" x="1072" y="325" text-anchor="middle">Pinecone</text></g>
    </g>

    <circle id="dot" r="7" fill="#C9A84C" opacity="0" style="filter:drop-shadow(0 0 6px #C9A84C)"/>
    <circle id="dot2" r="7" fill="#C9A84C" opacity="0" style="filter:drop-shadow(0 0 6px #C9A84C)"/>
  </svg>

  <div class="caption" aria-live="polite">
    <div class="num" id="capNum">1</div>
    <div><h2 id="capTitle"></h2><p id="capText"></p></div>
  </div>
  <div class="controls">
    <button id="prev" aria-label="Previous step">‹ Back</button>
    <button id="play">Pause</button>
    <button id="next" aria-label="Next step">Next ›</button>
    <div class="dots" id="dots"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

// AI steps, in the order the worker runs them.
const STEPS = [
  ["Check photo quality", "Checking photo"],
  ["Detect each item", "Finding items"],
  ["Read colour, fabric, style", "Reading details"],
  ["Remember the style", "Saving style"],
  ["Build combinations", "Combining"],
  ["Pick looks that suit you", "Choosing looks"],
  ["Render the previews", "Rendering"],
];
const NS = "http://www.w3.org/2000/svg";
STEPS.forEach(([label], i) => {
  const g = document.createElementNS(NS, "g");
  g.setAttribute("class", "step"); g.id = "st" + i;
  const y = 140 + i * 54;
  g.innerHTML = `<rect x="750" y="${y}" width="250" height="44" rx="10"/>
    <text x="766" y="${y + 27}">${i + 1}. ${label}</text>
    <path class="tick" d="M972 ${y + 22} l5 6 l10 -12" stroke="#8fbf7a" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  $("steps").appendChild(g);
});

let token = 0;               // cancels timers and motion from an earlier scene
const timers = [];
const later = (ms, fn) => { const t = token; timers.push(setTimeout(() => t === token && fn(), reduce ? 0 : ms)); };

function travel(dotId, pathId, ms, reverse) {
  const dot = $(dotId), path = $(pathId), len = path.getTotalLength(), t0 = performance.now(), mine = token;
  if (reduce) return;
  dot.setAttribute("opacity", 1);
  (function frame(now) {
    if (mine !== token) return;
    const k = Math.min(1, (now - t0) / ms), p = path.getPointAtLength((reverse ? 1 - k : k) * len);
    dot.setAttribute("cx", p.x); dot.setAttribute("cy", p.y);
    if (k < 1) requestAnimationFrame(frame); else dot.setAttribute("opacity", 0);
  })(t0);
}

const nodes = ["phone", "pay", "s3", "api", "db", "queue", "ai"];
const wires = ["w-phone-api", "w-api-s3", "w-api-db", "w-api-queue", "w-queue-ai", "w-ai-vec", "w-back", "w-pay"];
function stage({ on = [], hot = [], wire = [], screen = null }) {
  nodes.forEach((n) => { $("n-" + n).classList.toggle("on", on.includes(n) || hot.includes(n)); $("n-" + n).classList.toggle("hot", hot.includes(n)); });
  wires.forEach((w) => $(w).classList.toggle("on", wire.includes(w)));
  ["s-camera", "s-progress", "s-results"].forEach((s) => $(s).classList.toggle("show", s === screen));
  $("note").classList.remove("show");
  $("backLabel").setAttribute("opacity", wire.includes("w-back") ? 1 : 0);
}
function progress(pct, label) { $("bar").setAttribute("width", 106 * pct / 100); $("pct").textContent = pct + "%"; $("stepLabel").textContent = label || ""; }
function steps(doneUpTo, running) {
  STEPS.forEach((_, i) => { const c = $("st" + i).classList; c.toggle("done", i < doneUpTo); c.toggle("run", i === running); });
}

const SCENES = [
  { title: "You take a photo", ms: 5000,
    text: "Open the Glimms app and photograph your clothes or your room. You can add the occasion and where you are, so suggestions fit the day.",
    run() { stage({ hot: ["phone"], screen: "s-camera" }); steps(0, -1); progress(0);
      later(1400, () => { $("flash").classList.remove("go"); void $("flash").getBoundingClientRect(); $("flash").classList.add("go"); }); } },

  { title: "The app sends it to the Glimms API", ms: 6500,
    text: "The API checks who you are and how many scans you have left today. It stores the photo and records the job in the database.",
    run() { stage({ on: ["phone", "s3", "db"], hot: ["api"], wire: ["w-phone-api"], screen: "s-progress" }); steps(0, -1); progress(3, "Uploading");
      travel("dot", "w-phone-api", 1300);
      later(1500, () => { stage({ on: ["phone", "api"], hot: ["s3", "db"], wire: ["w-phone-api", "w-api-s3", "w-api-db"], screen: "s-progress" });
        travel("dot", "w-api-s3", 1100); travel("dot2", "w-api-db", 1100); }); } },

  { title: "The job waits in a queue", ms: 5500,
    text: "Styling takes a little while, so the job goes into a queue instead of making the app wait. A background worker picks it up.",
    run() { stage({ on: ["phone", "api", "s3", "db", "ai"], hot: ["queue"], wire: ["w-phone-api", "w-api-queue"], screen: "s-progress" }); steps(0, -1); progress(5, "Queued");
      travel("dot", "w-api-queue", 1100);
      later(1800, () => { stage({ on: ["phone", "api", "s3", "db", "queue"], hot: ["ai"], wire: ["w-api-queue", "w-queue-ai"], screen: "s-progress" }); travel("dot", "w-queue-ai", 1100); }); } },

  { title: "AI studies your photo, step by step", ms: 12500,
    text: "It checks the photo is usable, finds each item, reads its colour, fabric and style, and saves that style so later suggestions can build on it. Then it combines items and picks the looks that suit your taste and the occasion.",
    run() { stage({ on: ["phone", "api", "queue"], hot: ["ai"], wire: ["w-queue-ai", "w-back"], screen: "s-progress" });
      const pct = [10, 25, 40, 50, 65, 80, 92];
      STEPS.forEach(([, label], i) => later(i * 1500, () => {
        steps(i, i); progress(pct[i], label);
        $("w-ai-vec").classList.toggle("on", i === 3);
        if (i === 3) travel("dot2", "w-ai-vec", 600);
        travel("dot", "w-back", 1300, false);
      }));
      later(STEPS.length * 1500, () => { steps(STEPS.length, -1); progress(100, "Done"); }); } },

  { title: "Your looks arrive", ms: 6500,
    text: "Progress streams to the app live while it works. If you closed the app, a push notification tells you when the looks are ready.",
    run() { stage({ on: ["api", "queue", "ai"], hot: ["phone"], wire: ["w-back"], screen: "s-results" }); steps(STEPS.length, -1); progress(100);
      travel("dot", "w-back", 1200);
      later(900, () => $("note").classList.add("show"));
      later(3800, () => $("note").classList.remove("show")); } },

  { title: "Save what you like, upgrade when you need more", ms: 7000,
    text: "Save favourite looks to come back to. Free accounts get 10 scans a day. Premium and Pro raise that limit, paid by card through Paystack or in naira through Credo.",
    run() { stage({ on: ["phone", "api", "db"], hot: ["pay"], wire: ["w-pay", "w-phone-api", "w-api-db"], screen: "s-results" }); steps(STEPS.length, -1);
      $("heart").setAttribute("fill", "none");
      later(900, () => $("heart").setAttribute("fill", "#C9A84C"));
      later(1200, () => travel("dot", "w-phone-api", 900));
      later(2200, () => travel("dot", "w-api-db", 900)); } },
];

let cur = 0, playing = !reduce, advance = null;
SCENES.forEach((_, i) => { const b = document.createElement("button"); b.setAttribute("aria-label", "Step " + (i + 1)); b.onclick = () => show(i); $("dots").appendChild(b); });

function show(i) {
  token++; timers.splice(0).forEach(clearTimeout); clearTimeout(advance);
  $("dot").setAttribute("opacity", 0); $("dot2").setAttribute("opacity", 0);
  cur = (i + SCENES.length) % SCENES.length;
  const s = SCENES[cur];
  $("capNum").textContent = cur + 1; $("capTitle").textContent = s.title; $("capText").textContent = s.text;
  [...$("dots").children].forEach((d, k) => d.classList.toggle("cur", k === cur));
  s.run();
  if (playing) advance = setTimeout(() => show(cur + 1), s.ms);
}
$("next").onclick = () => show(cur + 1);
$("prev").onclick = () => show(cur - 1);
$("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "Pause" : "Play"; show(cur); };
$("play").textContent = playing ? "Pause" : "Play";
document.addEventListener("keydown", (e) => { if (e.key === "ArrowRight") show(cur + 1); if (e.key === "ArrowLeft") show(cur - 1); });
show(0);
</script>
</body>
</html>
