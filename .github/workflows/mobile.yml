name: Mobile app

on:
  push:
    branches: [main, develop]
    paths-ignore: ["backend/**", "render.yaml", "**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["backend/**", "render.yaml", "**/*.md"]

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Type check, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci
