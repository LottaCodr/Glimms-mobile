name: API (backend/api)

on:
  push:
    branches: [main, develop]
    paths: ["backend/api/**", ".github/workflows/api.yml"]
  pull_request:
    branches: [main]
    paths: ["backend/api/**", ".github/workflows/api.yml"]

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend/api

jobs:
  # ── Lint + Type-check + Build + Test ─────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      # Real PostgreSQL (same major as Supabase) so the migrations and every
      # query run through the production driver, not only the in-process PGlite
      # used for local `npm test`.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: glimms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d glimms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test (in-process PGlite)
        run: npm test

      - name: Test (PostgreSQL)
        run: npm run test:pg
        env:
          # The test harness drops and recreates the public schema of this database.
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/glimms_test

  # ── Docker build & push (main branch only) ────────────────────────────────
  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: backend/api
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            glimmsai/glimms-api:latest
            glimmsai/glimms-api:${{ github.sha }}
