name: AI services (backend/ai)

on:
  push:
    branches: [main, develop]
    paths: ["backend/ai/**", ".github/workflows/ai.yml"]
  pull_request:
    branches: [main]
    paths: ["backend/ai/**", ".github/workflows/ai.yml"]

concurrency:
  group: ai-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend/ai

jobs:
  import:
    name: Import ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [object_detection, attribute_extractor, embedding_engine,
                  permutation_engine, llm_reasoning, mockup_compositor,
                  quality_guard, context_inference]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/ai/services/${{ matrix.service }}/requirements.txt
      - run: pip install -r services/${{ matrix.service }}/requirements.txt
      - run: pip install pytest httpx
      - run: python -c "import sys; sys.path.insert(0,'.'); from services.${{ matrix.service }}.app.main import app; print('Import OK')"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/ai/requirements.txt
            backend/ai/requirements-test.txt
      - run: pip install -r requirements.txt -r requirements-test.txt
      - run: python -m pytest -q   # -m puts backend/ai on sys.path (gateway, shared, services)
