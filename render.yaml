# Render blueprint for the Glimms API (backend/api) and AI services (backend/ai).
#
# Lives at the repository root because Render only discovers blueprints there;
# the Docker build itself is scoped to backend/ai.
#
# Two shapes are offered:
#
#   glimms-ai          a PRIVATE service — no public URL at all. This is the
#                      recommended production shape: your product backend
#                      reaches it over Render's internal network, so the
#                      pipeline is never exposed to the internet.
#
#   glimms-ai-staging  a public web service, guarded by AI_INTERNAL_TOKEN,
#                      for integration testing against a real URL.
#
# Deploy with: render blueprint launch  (or connect the repo in the dashboard).

services:
  # ── Production: private, no public URL ────────────────────────────────────
  - type: pserv
    name: glimms-ai
    runtime: docker
    dockerfilePath: ./backend/ai/Dockerfile
    dockerContext: ./backend/ai
    # Mobile-app and API commits must not redeploy the AI services.
    buildFilter:
      paths:
        - backend/ai/**
    # The image carries the detection, CLIP and segmentation models. Eight
    # processes plus those models need ~2 GB; smaller plans are OOM-killed.
    plan: standard
    healthCheckPath: /livez
    envVars:
      - key: GLIMMS_ENV
        value: production
      # Mandatory in production: startup fails without it.
      - key: AI_INTERNAL_TOKEN
        generateValue: true
      # Prototype output must never reach users.
      - key: ALLOW_DEV_FALLBACKS
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_REQUEST_BYTES
        value: "20971520"
      - key: MAX_CONCURRENT_UPSTREAM
        value: "16"
      - key: ARTIFACT_URL_TTL_SECONDS
        value: "900"
      # Scope the bucket: read only session images, write only mockups.
      - key: S3_ALLOWED_KEY_PREFIXES
        value: users/
      - key: S3_OUTPUT_KEY_PREFIXES
        value: users/
      # Set these in the dashboard; never commit them.
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        sync: false
      # auto = real CLIP from the model baked into the image.
      - key: CLIP_ENABLED
        value: auto

  # ── Staging: public URL, token-guarded, fallbacks allowed ────────────────
  - type: web
    name: glimms-ai-staging
    runtime: docker
    dockerfilePath: ./backend/ai/Dockerfile
    dockerContext: ./backend/ai
    # Mobile-app and API commits must not redeploy the AI services.
    buildFilter:
      paths:
        - backend/ai/**
    # The image carries the detection, CLIP and segmentation models. Eight
    # processes plus those models need ~2 GB; smaller plans are OOM-killed.
    plan: standard
    healthCheckPath: /livez
    envVars:
      - key: GLIMMS_ENV
        value: staging
      - key: AI_INTERNAL_TOKEN
        generateValue: true
      # Staging exists to exercise the contract, so prototypes are fine here.
      - key: ALLOW_DEV_FALLBACKS
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false

  # ── API: the public backend the mobile app talks to ───────────────────────
  # HTTP, WebSocket and the design worker run in this one process. Postgres is
  # Supabase (not provisioned here); Redis is the Key Value instance below.
  - type: web
    name: glimms-api
    runtime: docker
    dockerfilePath: ./backend/api/Dockerfile
    dockerContext: ./backend/api
    buildFilter:
      paths:
        - backend/api/**
    plan: starter
    healthCheckPath: /health
    # Forward-only migrations run before each new version takes traffic.
    preDeployCommand: npm run db:migrate:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: glimms-redis
          property: connectionString
      # The AI services, over Render's private network.
      - key: AI_INTERNAL_TOKEN
        fromService:
          type: pserv
          name: glimms-ai
          envVarKey: AI_INTERNAL_TOKEN
      # Set these in the dashboard; never commit them.
      - key: AI_GATEWAY_URL          # glimms-ai's internal address, e.g. http://glimms-ai:10000
        sync: false
      - key: PUBLIC_API_URL          # https://<this service>.onrender.com or your domain
        sync: false
      - key: DATABASE_URL            # Supabase session pooler (port 5432)
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: APPLE_CLIENT_IDS
        sync: false
      - key: PAYSTACK_SECRET_KEY     # sk_live_… (also signs the webhook)
        sync: false
      - key: PAYSTACK_PREMIUM_PLAN_CODE   # PLN_…
        sync: false
      - key: PAYSTACK_PRO_PLAN_CODE       # PLN_…
        sync: false
      - key: CREDO_PUBLIC_KEY
        sync: false
      - key: CREDO_SECRET_KEY
        sync: false
      - key: CREDO_BASE_URL          # https://api.credocentral.com (live) or https://api.credodemo.com
        sync: false
      - key: CREDO_PREMIUM_AMOUNT    # kobo
        sync: false
      - key: CREDO_PRO_AMOUNT        # kobo
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        sync: false

  # ── Redis for queues and rate limits ──────────────────────────────────────
  # BullMQ loses jobs if Redis evicts keys, so eviction must be off.
  - type: keyvalue
    name: glimms-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []   # private network only
